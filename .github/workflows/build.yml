name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BotApp.sln

      - name: Build
        run: dotnet build BotApp.sln -c Debug --no-restore

      - name: Test
        run: dotnet test Bot.Core.Tests -c Debug --no-build --filter "TestCategory!=Integration"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Tesseract
        run: brew install tesseract

      - name: Build CLI
        run: dotnet build Bot.Cli -c Release

      - name: Self-test (OpenCV + Tesseract native libraries)
        run: dotnet Bot.Cli/bin/Release/net10.0/KingshotAuto.Cli.dll --selftest

      - name: Unit tests
        run: dotnet test Bot.Core.Tests -c Release --filter "TestCategory!=Integration"
